[General]
DisableDefaultImports=false
MaxWarnings=-1

[Warnings]
# Quickshell synthesizes qs.* module qmldir files into its in-memory VFS at
# runtime. They do not exist on disk, so qmllint cannot resolve them and reports
# every qs.* import as a failure. Not a code defect; unfixable without changing
# how Quickshell loads modules.
ImportFailure=disable

# UnqualifiedAccess is deliberately left enabled. Every root object now carries
# "pragma ComponentBehavior: Bound", the `t` theme alias is qualified as root.t,
# and Repeater delegates are reached through their own ids. The only hits that
# remain are Quickshell's `anchors`/`margins` attached-property groups, which
# qmllint cannot resolve; those four lines carry an inline
# "// qmllint disable unqualified" comment rather than silencing the class.

# PanelWindow is exported by Quickshell and is creatable there; qmllint only sees
# the type registration, not Quickshell's own instantiation rules.
UncreatableType=disable

# "Type anchors is used but it is not resolved" is a qmllint artifact for
# attached-property groups, not a missing type.
UnresolvedType=disable

# Member reads off Loader.item or untyped QObjects resolve at runtime against
# whatever the Loader loaded; qmllint only sees QObject.
MissingProperty=disable

# PopupWindow's anchor.edges/gravity/adjustment are attached properties
# Quickshell attaches at runtime.
MissingType=disable
